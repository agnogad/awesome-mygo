name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build list and site
        run: make build

      - name: Publish to surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: npx --yes surge site awesome-mygo.surge.sh
